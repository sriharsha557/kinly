<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Built like a trusted room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1080px; height:1080px; overflow:hidden;}
  body{background:#3B5D45; font-family:'Public Sans',sans-serif; color:#FBF7F2; position:relative;}
  .card{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 120px;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:26px; letter-spacing:0.16em; text-transform:uppercase; color:#AFCBB3; font-weight:600; margin-bottom:52px;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:100px; line-height:1.14; letter-spacing:-0.01em;}
  h1 em{font-style:italic; color:#F7B267;}
  .rules{margin-top:64px; font-size:36px; line-height:1.5; color:#D8E4D6;}
  .rules div{display:flex; align-items:baseline; gap:22px; margin-bottom:26px;}
  .rules div::before{content:'—'; color:#F7B267;}
  .footer{position:absolute; left:120px; bottom:90px; font-family:'Newsreader',Georgia,serif; font-size:40px;}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">The thought behind it</div>
    <h1>Built like a <em>trusted room</em>.</h1>
    <div class="rules">
      <div>No public profiles, no followers, no likes from strangers</div>
      <div>Invite-only circles of 2–10 friends</div>
      <div>What happens in a circle stays in that circle</div>
    </div>
  </div>
  <div class="footer">kinly</div>
</body>
</html>
