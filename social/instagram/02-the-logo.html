<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Kinly logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1080px; height:1080px; overflow:hidden;}
  body{background:#FBF7F2; font-family:'Public Sans',sans-serif; color:#22281F; position:relative;}
  .card{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 110px;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:26px; letter-spacing:0.16em; text-transform:uppercase; color:#3B5D45; font-weight:600; margin-bottom:60px;}
  .card img{width:400px; height:400px; object-fit:contain;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:66px; line-height:1.2; letter-spacing:-0.01em; margin-top:64px;}
  h1 em{font-style:italic; color:#D9600A;}
  .body{margin-top:36px; font-size:33px; line-height:1.5; color:#565C4C; max-width:32ch;}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Why this logo</div>
    <img src="../../store-listing/logo-glyph.png" alt="Two people linking arms in an endless loop">
    <h1>Two people, <em>holding on</em> to each other.</h1>
    <div class="body">Look closer: their arms form an endless loop. You keep them going, they keep you going. That's the whole app in one mark.</div>
  </div>
</body>
</html>
