<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>One loop, every day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1080px; height:1080px; overflow:hidden;}
  body{background:#FBF7F2; font-family:'Public Sans',sans-serif; color:#22281F; position:relative;}
  .card{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 120px 130px;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:26px; letter-spacing:0.16em; text-transform:uppercase; color:#3B5D45; font-weight:600; margin-bottom:40px;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:88px; line-height:1.1; letter-spacing:-0.01em; margin-bottom:56px;}
  h1 em{font-style:italic; color:#F97316;}
  .steps{display:flex; flex-direction:column; gap:34px;}
  .step{display:flex; align-items:baseline; gap:26px; font-size:38px;}
  .dot{width:18px; height:18px; border-radius:50%; background:#F97316; flex-shrink:0; position:relative; top:-4px;}
  .step:nth-child(even) .dot{background:#7FA383;}
  .step strong{font-weight:600;}
  .step span.rest{color:#565C4C;}
  .footer{position:absolute; left:120px; bottom:90px; display:flex; align-items:center; gap:18px;}
  .footer img{width:56px; height:56px;}
  .footer span{font-family:'Newsreader',Georgia,serif; font-size:40px;}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">What the app does</div>
    <h1>One <em>loop</em>, every day.</h1>
    <div class="steps">
      <div class="step"><span class="dot"></span><span><strong>Start a circle.</strong> <span class="rest">Invite 2–10 friends you trust.</span></span></div>
      <div class="step"><span class="dot"></span><span><strong>Set your goals.</strong> <span class="rest">Health, wealth, learning, ideas.</span></span></div>
      <div class="step"><span class="dot"></span><span><strong>Log progress.</strong> <span class="rest">A minute or two, most days.</span></span></div>
      <div class="step"><span class="dot"></span><span><strong>Watch it grow.</strong> <span class="rest">Streaks, gardens, momentum.</span></span></div>
      <div class="step"><span class="dot"></span><span><strong>Show up for them.</strong> <span class="rest">Nudge, cheer, challenge.</span></span></div>
    </div>
  </div>
  <div class="footer">
    <img src="../../store-listing/logo-glyph.png" alt="">
    <span>kinly</span>
  </div>
</body>
</html>
