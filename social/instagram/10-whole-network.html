<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The whole network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1080px; height:1080px; overflow:hidden;}
  body{background:radial-gradient(circle at 70% 25%, #FB8B3C, #F97316 55%, #EA6A0E); font-family:'Public Sans',sans-serif; color:#FFF8F0; position:relative;}
  .card{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 110px;}
  .count{font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:230px; line-height:1; letter-spacing:-0.02em;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:78px; line-height:1.18; letter-spacing:-0.01em; margin-top:36px;}
  h1 em{font-style:italic;}
  .body{margin-top:44px; font-size:34px; line-height:1.5; color:rgba(255,248,240,0.92); max-width:28ch;}
  .footer{position:absolute; left:0; right:0; bottom:90px; text-align:center; font-family:'Newsreader',Georgia,serif; font-size:40px;}
</style>
</head>
<body>
  <div class="card">
    <div class="count">2–10</div>
    <h1>friends. That's the <em>whole network</em>.</h1>
    <div class="body">No algorithm deciding who sees you. No strangers to perform for. Just your people, keeping each other going.</div>
  </div>
  <div class="footer">kinly</div>
</body>
</html>
