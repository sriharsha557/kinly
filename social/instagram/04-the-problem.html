<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The problem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1080px; height:1080px; overflow:hidden;}
  body{background:#22281F; font-family:'Public Sans',sans-serif; color:#FBF7F2; position:relative;}
  .card{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 120px;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:26px; letter-spacing:0.16em; text-transform:uppercase; color:#7FA383; font-weight:600; margin-bottom:52px;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:92px; line-height:1.16; letter-spacing:-0.01em;}
  h1 em{font-style:italic; color:#F97316;}
  .body{margin-top:56px; font-size:35px; line-height:1.55; color:#B9BFAD; max-width:28ch;}
  .footer{position:absolute; left:120px; bottom:90px; font-family:'Newsreader',Georgia,serif; font-size:40px; color:#FBF7F2;}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">The problem</div>
    <h1>You already know what you <em>should</em> do.</h1>
    <div class="body">Exercise. Read. Save. Learn. Knowing was never the problem. Staying consistent once motivation runs out — that's the problem.</div>
  </div>
  <div class="footer">kinly</div>
</body>
</html>
