<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Why the name Kinly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1080px; height:1080px; overflow:hidden;}
  body{background:#FBF7F2; font-family:'Public Sans',sans-serif; color:#22281F; position:relative;}
  .card{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 120px;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:26px; letter-spacing:0.16em; text-transform:uppercase; color:#3B5D45; font-weight:600; margin-bottom:44px;}
  .word{font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:150px; line-height:1; letter-spacing:-0.01em;}
  .word em{font-style:italic; color:#F97316;}
  .equation{margin-top:56px; font-family:'Newsreader',Georgia,serif; font-size:56px; color:#565C4C;}
  .equation strong{color:#22281F; font-weight:500;}
  .body{margin-top:56px; font-size:34px; line-height:1.5; color:#565C4C; max-width:26ch;}
  .footer{position:absolute; left:120px; bottom:90px; display:flex; align-items:center; gap:18px;}
  .footer img{width:56px; height:56px;}
  .footer span{font-family:'Newsreader',Georgia,serif; font-size:40px;}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Why the name</div>
    <div class="word">kin<em>ly</em></div>
    <div class="equation"><strong>kin</strong> — the people closest to you<br><strong>kindly</strong> — how they hold you to it</div>
    <div class="body">Not followers. Not an audience. The few people who actually notice when you go quiet.</div>
  </div>
  <div class="footer">
    <img src="../../store-listing/logo-glyph.png" alt="">
    <span>kinly</span>
  </div>
</body>
</html>
