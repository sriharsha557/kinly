<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Every goal plants something</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1080px; height:1080px; overflow:hidden;}
  body{background:#FBF7F2; font-family:'Public Sans',sans-serif; color:#22281F; position:relative;}
  .card{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 110px;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:26px; letter-spacing:0.16em; text-transform:uppercase; color:#3B5D45; font-weight:600; margin-bottom:56px;}
  .sprouts{display:flex; align-items:flex-end; gap:56px; margin-bottom:72px;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:88px; line-height:1.15; letter-spacing:-0.01em;}
  h1 em{font-style:italic; color:#3B5D45;}
  .body{margin-top:44px; font-size:34px; line-height:1.5; color:#565C4C; max-width:30ch;}
  .footer{position:absolute; left:0; right:0; bottom:90px; text-align:center; font-family:'Newsreader',Georgia,serif; font-size:40px;}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">How it works</div>
    <div class="sprouts">
      <svg width="70" viewBox="0 0 100 100"><path d="M50 92 C50 70 50 60 50 52" stroke="#8A8F7C" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M50 64 C38 61 32 52 33 42 C45 44 51 52 50 64 Z" fill="#B9BFAD"/></svg>
      <svg width="96" viewBox="0 0 100 100"><path d="M50 92 C50 64 50 52 50 42" stroke="#3B5D45" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M50 58 C34 54 26 42 28 28 C44 30 52 42 50 58 Z" fill="#7FA383"/><path d="M50 48 C64 44 72 34 70 20 C56 22 48 34 50 48 Z" fill="#3B5D45"/></svg>
      <svg width="128" viewBox="0 0 100 100"><path d="M50 92 C50 60 50 46 50 34" stroke="#3B5D45" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M50 52 C32 48 23 34 25 18 C43 20 52 34 50 52 Z" fill="#7FA383"/><path d="M50 42 C66 38 75 26 73 10 C57 12 48 26 50 42 Z" fill="#3B5D45"/><circle cx="50" cy="30" r="9" fill="#F97316"/></svg>
      <svg width="96" viewBox="0 0 100 100"><path d="M50 92 C50 64 50 52 50 42" stroke="#3B5D45" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M50 58 C34 54 26 42 28 28 C44 30 52 42 50 58 Z" fill="#7FA383"/><path d="M50 48 C64 44 72 34 70 20 C56 22 48 34 50 48 Z" fill="#3B5D45"/></svg>
      <svg width="70" viewBox="0 0 100 100"><path d="M50 92 C50 70 50 60 50 52" stroke="#8A8F7C" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M50 64 C62 61 68 52 67 42 C55 44 49 52 50 64 Z" fill="#B9BFAD"/></svg>
    </div>
    <h1>Every goal <em>plants</em> something.</h1>
    <div class="body">Log progress and your garden grows. Go quiet, and it wilts. No lectures, no red streaks screaming at you — just a plant that notices.</div>
  </div>
  <div class="footer">kinly</div>
</body>
</html>
