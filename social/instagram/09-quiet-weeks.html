<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiet weeks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1080px; height:1080px; overflow:hidden;}
  body{background:#FBF7F2; font-family:'Public Sans',sans-serif; color:#22281F; position:relative;}
  .blob{position:absolute; width:540px; height:540px; border-radius:50%; background:#F6EDE2; bottom:-260px; left:-200px;}
  .card{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 120px;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:100px; line-height:1.16; letter-spacing:-0.01em;}
  h1 em{font-style:italic; color:#F97316;}
  .body{margin-top:60px; font-size:35px; line-height:1.55; color:#565C4C; max-width:27ch;}
  .footer{position:absolute; left:120px; bottom:90px; display:flex; align-items:center; gap:18px;}
  .footer img{width:56px; height:56px;}
  .footer span{font-family:'Newsreader',Georgia,serif; font-size:40px;}
</style>
</head>
<body>
  <div class="blob"></div>
  <div class="card">
    <h1>Your friends see your streaks. And your <em>quiet weeks</em> too.</h1>
    <div class="body">That gentle visibility is the whole point. Not pressure, not shame. Just people who notice, and a one-tap nudge when you need it.</div>
  </div>
  <div class="footer">
    <img src="../../store-listing/logo-glyph.png" alt="">
    <span>kinly</span>
  </div>
</body>
</html>
